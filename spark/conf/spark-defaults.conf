# Giờ Việt Nam cho cả JVM lẫn Spark SQL để timestamp (không timezone) của
# PostgreSQL giữ nguyên "giờ đồng hồ" khi đọc/ghi qua JDBC.
spark.sql.session.timeZone        Asia/Ho_Chi_Minh
spark.driver.extraJavaOptions     -Duser.timezone=Asia/Ho_Chi_Minh -Dlog4j2.configurationFile=file:/opt/spark/conf/log4j2-driver.properties
spark.executor.extraJavaOptions   -Duser.timezone=Asia/Ho_Chi_Minh

spark.driver.memory               768m
spark.executor.memory             1g
spark.executor.cores              2
spark.cores.max                   2

spark.sql.shuffle.partitions      8
spark.sql.adaptive.enabled        true
spark.sql.autoBroadcastJoinThreshold  20971520
spark.ui.showConsoleProgress      false
spark.sql.debug.maxToStringFields 200
